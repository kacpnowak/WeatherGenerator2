# Paper evaluation config — nine-year forced forecast from 2001-01-01, run r0drop2
# (inference of fvdrop02 (run A extended): per-variable streams TEMP, SALT, SURFACE, U, V)..
# Comparable channel by channel with yr1sal01/yr1win03/yr1add04 (same cache tree,
# same 2180-2209 climatology); temp_2 here == sst there, salt_2 == sss (the new streams
# carry no sst/sss copies).
run_id: r0drop2
results_dir: /e/scratch/weatherai/shared_work/results/r0drop2
mini_epoch: 0
mesh_path: /e/data1/climateai/hclimrep/data/ifs-fesom/fesom.mesh.diag.nc
streams: [TEMP, SALT, SURFACE, U, V]

# Per-variable streams: mesh entity (wet masks / area weights) and the climatology zarr
# their channels are taken from. The rollout runs in the 2000-2009 held-out decade, so each
# entity has one source holding every channel, built from that decade with
# `paper_eval.build_clim --stream FESOM_NODE_2000s|FESOM_ELEM_2000s --channels <all>`.
stream_layout:
  TEMP:    {entity: node, clim: [FESOM_NODE_2000s]}
  SALT:    {entity: node, clim: [FESOM_NODE_2000s]}
  SURFACE: {entity: node, clim: [FESOM_NODE_2000s]}
  U:       {entity: elem, clim: [FESOM_ELEM_2000s]}
  V:       {entity: elem, clim: [FESOM_ELEM_2000s]}

truth:   # ground-truth archives: per stream (archive normalization statistics for the
         # persistence denormalization) and per climatology source (build_clim)
  TEMP:    /e/data1/climateai/hclimrep/data/ifs-fesom/ocean_node
  SALT:    /e/data1/climateai/hclimrep/data/ifs-fesom/ocean_node
  SURFACE: /e/data1/climateai/hclimrep/data/ifs-fesom/ocean_node
  U:       /e/data1/climateai/hclimrep/data/ifs-fesom/ocean_elem
  V:       /e/data1/climateai/hclimrep/data/ifs-fesom/ocean_elem
  FESOM_NODE_2000s: /e/data1/climateai/hclimrep/data/ifs-fesom/ocean_node
  FESOM_ELEM_2000s: /e/data1/climateai/hclimrep/data/ifs-fesom/ocean_elem

climatology:
  ref_start: 2000      # the held-out decade the rollout runs in
  ref_end: 2009

init_filter:
  start: "2001-01-01"
  end: null

leads:
  max: 3285            # per-sample scores computed for leads 1..max
  map_leads: [365, 730, 1095, 1461, 1826, 2191, 2556, 2922, 3285]  # leads with spatial accumulations + spectra

regions:            # per-sample score aggregation regions; lat bounds [south, north]
  global: null      # whole mesh
  nh: [0, 90]       # lat >= 0
  sh: [-90, 0]      # lat < 0   (boundary nodes at exactly 0 belong to nh)

seasons:
  DJF: [12, 1, 2]
  MAM: [3, 4, 5]
  JJA: [6, 7, 8]
  SON: [9, 10, 11]
  exclude_init_months: [12]
  channels: [temp_2, salt_2, ssh]    # temp_2/salt_2 stand in for the old sst/sss

showcase:
  init_time: "2001-01-01"
  leads: [1, 90, 180, 363]

spectra:   # not run for the per-variable layout (compute_spectra.py is FESOM_NODE/ELEM only)
  n_samples: 8
  leads: [90, 363]
  scalar_channels: [ssh, temp_2]
  velocity_pairs: [[u_2, v_2]]
  bands:
    global: null
  scale_min_km: 150
  scale_max_km: 5000
  n_scales: 20
  filter_order: 1
  filter_cache: /work/ab0995/a270225/WeatherGenerator2/paper_eval/cache/fesom_filter_core2.npz
  n_workers: 12

figures:
  map_channels: [temp_2, ssh, salt_2, temp_107, salt_107, u_2, v_2]
  curve_depths: [2, 107, 450]
  depth_rmse_normalised: true

compute:
  n_workers: 16

selfcheck:   # selfcheck.py's node stream and its all-wet surface channel (sst there)
  stream: TEMP
  surface_channel: temp_2

output:
  cache_dir: /e/scratch/hclimrep/nowak2/paper_eval_r1
  fig_dir: /e/scratch/hclimrep/nowak2/paper_eval_r1/figures
