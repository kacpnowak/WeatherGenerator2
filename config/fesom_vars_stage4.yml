# Stage 4 of the fesom_vars retrain: continue stage 3 (fvars003) with a spin-up window twice as
# long (0-180 days without gradients before the 15 supervised days). In the one-year rollouts
# from 2209-01-01, fvars002 (no spin-up) blew up between day 60 and 90 and fvars003 (0-90-day
# window) between day 90 and 120, so the stable period seems tied to the trained horizon; this
# stage tests that. The 5x surface weight on temp_2/salt_2 is inherited from fvars003's saved
# stream config. Fresh schedule (general.istep=0 on the command line).

training_config:
  num_mini_epochs: 10
  samples_per_mini_epoch: 2048
  learning_rate_scheduling:
    lr_start: 1e-6
    lr_max: 1e-5
    lr_final_decay: 2e-6
    lr_final: 0.0
    num_steps_warmup: 256
    num_steps_cooldown: 512
  forecast:
    num_steps: 15
    prefix_steps: [0, 180]

freeze_modules: ""

validation_config:
  samples_per_mini_epoch: 256
