# Overwrite that switches a FESOM run to the IFS-forced stream set with a condition
# stream (adaln_local injection). The forecasting engine is built with AdaLN norms, so
# checkpoints trained without a condition stream only load partially.
streams_directory: "./config/streams/fesom_forced_adaln/"
