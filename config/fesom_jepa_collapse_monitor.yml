# Collapse monitoring for temporal-JEPA pretraining (config/fesom_jepa_pretrain.yml has the same
# block): effective rank, singular-value spectrum and per-dimension variance of the student JEPA
# prediction and the EMA-teacher target, every 20 steps. An overlay to switch it on when resuming
# a run started without it:
#   train_continue --from-run-id <run> -e -1 --reuse-run-id \
#       --config config/fesom_jepa_collapse_monitor.yml

train_logging:
  collapse_monitoring:
    enabled: true
    compute_frequency: 20
    log_frequency: 20
    metrics:
      effective_rank: {enabled: true, tensor_source: "both", sample_size: 2048}
      singular_values: {enabled: true, tensor_source: "both", sample_size: 2048}
      dimension_variance: {enabled: true, tensor_source: "both"}
      prototype_entropy: {enabled: false}
      ema_beta: {enabled: true}
