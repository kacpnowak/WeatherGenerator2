# Run A of long-rollout round 1 (fvdrop01), layered on fesom_vars_stage3.yml and
# fesom_vars_r1_base.yml: forecasting-engine dropout off. Everything else is run C's stage 3.
#
# With the latent noise off (base overlay), dropout is the last train-only perturbation on the
# rollout path: it is active on every forecast step, also in the no-grad spin-up, and absent at
# inference. Without it the training forward pass matches inference, so the states the model
# learns to roll out are the states it meets in a free rollout.

fe_dropout_rate: 0.0
