# Per-variable FESOM stream: temperature (31 channels, archive 'ocean_node').
# One stream per variable so each gets its own embedding and prediction head.
# Wet/dry is derived from the FESOM mesh (wet_mask_from_mesh), not from stored zeros,
# so no fill value is set; bathymetry_geoinfo adds log1p(bottom depth) as geoinfo.
# Normalised with wet-point statistics (wet_stats_node.json), computed over wet points only.

TEMP :
  type : fesom
  stream_id : 2150
  filenames : ['ocean_node']
  loss_weight : 1.
  mesh_path : /e/data1/climateai/hclimrep/data/ifs-fesom/fesom.mesh.diag.nc
  wet_mask_from_mesh : true
  bathymetry_geoinfo : true
  normalization_stats : config/streams/fesom/wet_stats_node.json
  source :
  - temp_2
  - temp_7
  - temp_15
  - temp_25
  - temp_35
  - temp_45
  - temp_55
  - temp_65
  - temp_75
  - temp_85
  - temp_95
  - temp_107
  - temp_125
  - temp_147
  - temp_175
  - temp_210
