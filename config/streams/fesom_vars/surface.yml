# Per-variable FESOM stream: surface fields (sea surface height, ice concentration and ice mass) (3 channels, archive 'ocean_node').
# One stream per variable so each gets its own embedding and prediction head.
# Wet/dry is derived from the FESOM mesh (wet_mask_from_mesh), not from stored zeros,
# so no fill value is set; bathymetry_geoinfo adds log1p(bottom depth) as geoinfo.

SURFACE :
  type : fesom
  stream_id : 2154
  filenames : ['ocean_node']
  loss_weight : 1.
  mesh_path : /e/data1/climateai/hclimrep/data/ifs-fesom/fesom.mesh.diag.nc
  wet_mask_from_mesh : true
  bathymetry_geoinfo : true
  source :
  - ssh
  - a_ice
  - m_ice
  target :
  - ssh
  - a_ice
  - m_ice
  location_weight : cosine_latitude
  masking_rate : 0.6
  masking_rate_none : 0.05
  token_size : 32
  tokenize_spacetime : True
  max_num_targets: 32768
  embed :
    net : transformer
    num_tokens : 1
    num_heads : 8
    dim_embed : 256
    num_blocks : 2
  embed_target_coords :
    net : mlp
    dim_embed : 256
  target_readout :
    num_layers : 2
    num_heads : 4
  pred_head :
    ens_size : 1
    num_layers : 1
