# Per-variable FESOM stream: meridional velocity (31 channels, archive 'ocean_elem').
# One stream per variable so each gets its own embedding and prediction head.
# Wet/dry is derived from the FESOM mesh (wet_mask_from_mesh), not from stored zeros,
# so no fill value is set; bathymetry_geoinfo adds log1p(bottom depth) as geoinfo.
# Normalised with wet-point statistics (wet_stats_elem.json), computed over wet points only.

V :
  type : fesom
  stream_id : 2153
  filenames : ['ocean_elem']
  loss_weight : 1.
  mesh_path : /e/data1/climateai/hclimrep/data/ifs-fesom/fesom.mesh.diag.nc
  wet_mask_from_mesh : true
  bathymetry_geoinfo : true
  normalization_stats : config/streams/fesom/wet_stats_elem.json
  source :
  - v_2
  - v_7
  - v_15
  - v_25
  - v_35
  - v_45
  - v_55
  - v_65
  - v_75
  - v_85
  - v_95
  - v_107
  - v_125
  - v_147
  - v_175
  - v_210
  - v_255
  - v_310
  - v_375
  - v_450
  - v_535
  - v_630
  - v_735
  - v_850
  - v_975
  - v_1110
  - v_1255
