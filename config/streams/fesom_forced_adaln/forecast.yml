# Time-of-year / time-of-day condition for the forecasting engine. Its presence builds the
# forecasting engine with AdaLN norms; the global and adaln_local forcing modes add the
# forcing onto this condition.
Forecast_conditions :
  type : condition
  filenames : []
  variables : ['start_day', 'start_time', 'end_day', 'end_time']
  transform : "fourier"  # absolute, absolute_normalized, cos_sin, fourier
  entry_point : "forecast_engine"
  emb_dimension : 16
  # not predicted; the dynamic loss reads the target channels of every stream
  train_target_channels : []
  val_target_channels : []
