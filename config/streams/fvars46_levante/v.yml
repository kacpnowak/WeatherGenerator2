# Per-variable FESOM stream: meridional velocity on ALL wet levels
# (46 channels, 2-5825 m, archive 'ocean_elem'). The archive's 47th level (v_6125) has no
# wet points and is left out. Same settings as ../fesom_vars/v.yml (31 levels, to 2035 m) otherwise,
# except the Levante mesh_path, embed.dim_embed 512 and target_readout.num_layers 4.
# One stream per variable so each gets its own embedding and prediction head.
# Wet/dry is derived from the FESOM mesh (wet_mask_from_mesh), not from stored zeros,
# so no fill value is set; bathymetry_geoinfo adds log1p(bottom depth) as geoinfo.
# Normalised with wet-point statistics (wet_stats_elem.json), computed over wet points only.

V :
  type : fesom
  stream_id : 2153
  filenames : ['ocean_elem']
  loss_weight : 1.
  mesh_path : /work/ab0995/a270225/atmorep_data/multiverse/core2/original/cycle_1/fesom.mesh.diag.nc
  wet_mask_from_mesh : true
  bathymetry_geoinfo : true
  normalization_stats : config/streams/fesom/wet_stats_elem.json
