# IFS atmosphere as a per-step forcing for the FESOM ocean streams, restricted to the
# atmospheric state: no variable computed from the coupled model's ocean or sea ice, so a
# free-running forecast is never pulled towards the true ocean through the forcing.
#   10u, 10v : 10 m wind (the model derives the wind stress itself)
#   2t, 2d   : 2 m temperature and dewpoint (over the sea they partly follow SST; the
#              mildest leak, kept as in standard forced-ocean setups)
#   msl      : mean sea-level pressure
#   cp, lsp  : convective and large-scale precipitation (freshwater input)
#   tcc      : total cloud cover (with the sun, sets the surface shortwave)
#   tsr      : top-of-atmosphere net solar, the seasonal sunlight signal (its sea-ice
#              albedo part is a small polar leak, accepted)
# Left out on purpose: tsrc (clear-sky net solar: mostly sea-ice albedo), ci and sst (the
# ocean's state handed to the atmosphere) and the ocean archive's fluxes (fh, fw, evap,
# prec, swr, tx_sur, ty_sur), which are computed from the true ocean.
#
# Otherwise identical to ../fesom_forced/ifs_forcing.yml:
#
# The atmosphere is NOT predicted and has no encoder: it is prescribed, re-read at
# every forecast step's valid window and injected into the forecasting engine.
#
#   type : forcing    -> routed through the per-step forcing path
#   reader : fesom    -> the data is in the FESOM-format zarr, read by DataReaderFesom
#   frequency         -> IFS is 6-hourly; a daily window holds four snapshots
#   window_shift      -> IFS is stamped at the end of each 6 h interval: the ocean day that
#                        starts at 00 is forced by the stamps 06, 12, 18 and 00 (next day)
#
# injection.time_reduce: how the snapshots of one window become one field
#   mean  : mean over the window (default)
#   stack : all snapshots as separate channels (needs `frequency`)
#   last  : final snapshot only
# injection.mode: none | additive | cross_attn | global | adaln_local
#   global and adaln_local need a condition stream, see ../fesom_forced_adaln/
IFS_ATMO :
  type : forcing
  reader : fesom
  stream_id : 2139
  filenames : ['atmos_all']
  entry_point : "forecast_engine"
  frequency : 06:00:00
  window_shift : 06:00:00
  source : ['10u', '10v', '2t', '2d', 'msl', 'cp', 'lsp', 'tcc', 'tsr']
  train_target_channels : []
  val_target_channels : []
  geoinfo_channels : []
  loss_weight : 0.
  location_weight : cosine_latitude
  token_size : 8
  tokenize_spacetime : True
  injection :
    mode : additive
    time_reduce : mean
  embed :
    net : transformer
    num_tokens : 1
    num_heads : 8
    dim_embed : 256
    num_blocks : 2
