IFS_ATMO :
  type : fesom
  stream_id : 2139
  diagnostic : True
  filenames : ['atmos_all']
  loss_weight: 1.0
  source: ['10u', '10v', '2d', '2t', 'cp', 'lsp', 'msl', 'tsr', 'tsrc']
  target: ["^"]
  target_exclude: ['msl', 'tsr', 'tsrc', '_']
  location_weight : cosine_latitude
  masking_rate : 0.6
  masking_rate_none : 0.05
  token_size : 32
  tokenize_spacetime : True
  max_num_targets: -1 
  embed : 
    net : transformer
    num_tokens : 1
    num_heads : 8
    dim_embed : 256
    num_blocks : 2
  embed_target_coords :
    net : mlp
    dim_embed : 256
  target_readout :
    num_layers : 0
    num_heads : 4
  pred_head :
    ens_size : 0
    num_layers : 1