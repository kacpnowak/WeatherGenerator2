ATMO:
  # v2 mid-cycle ATMO swap (2026-08-03): msl/cp replaced by surface radiation.
  # SST diagnosis showed the v1-forcing models effectively ignore the atmosphere
  # (no heat-budget information: msl data all-NaN at eval, cp weak/incomplete) and
  # produce spurious surface variability (0.6 C/day vs true 0.18 C/day).
  # ssrd/strd are the actual surface downward short/longwave fluxes; the OceanBench
  # IFS forcings carry them natively as sosudosw/sosudolw (NEMO names), so the eval
  # side needs no proxy. skt was considered instead but is NOT in the OceanBench
  # forcings (would be a dead channel at eval, like msl was).
  # Channel count stays 6 so this is a drop-in replacement for checkpoints of the
  # in-flight v2 run (glorys_20260730_223127): the anemoi reader orders channels by
  # the zarr's variable order, giving [10u, 10v, 2d, 2t, ssrd, strd] - positions 0-3
  # identical to the old [10u, 10v, 2d, 2t, cp, msl], so only the two replaced slots
  # must relearn their embedding.
  type : anemoi
  stream_id : 2139
  # 1979-2024 (6h) sibling of the previous 1979-2023 v8 zarr; adds ssrd/strd
  # (also skt/tcw/tp if ever wanted). Same ERA5 family, N320 grid.
  filenames : ['/e/data1/slmet/ml_training/aifs-ea-an-oper-0001-mars-n320-1979-2024-6h-v1-for-single-v2.zarr']
  loss_weight : 1.0
  source :
  - 2t
  - 2d
  - 10u
  - 10v
  - ssrd
  - strd
  target : [""]
  target_exclude: ['msl', 'z']
  masking_rate : 0.6
  masking_rate_none : 0.05
  token_size : 64
  location_weight : cosine_latitude
  tokenize_spacetime : True
  embed :
    net : transformer
    num_tokens : 1
    num_heads : 8
    dim_embed : 256
    num_blocks : 2
  embed_target_coords :
    net : mlp
    dim_embed : 256
  target_readout :
    num_layers : 0
    num_heads : 0
    # sampling_rate : 0.2
  pred_head :
    ens_size : 1
    num_layers : 0
