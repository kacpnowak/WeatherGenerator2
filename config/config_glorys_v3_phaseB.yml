#
# v3 GLORYS curriculum, phase B: continues phase A (config_glorys_v3_phaseA.yml)
# via `train_continue --from-run-id <v3 run> --reuse-run-id` so the epoch
# counter and LR schedule carry over. Narrows to the 2010+ recency window,
# still with a 4-step forecast; phase C (config_glorys_v3_phaseC.yml) extends
# the forecast horizon to 10 steps.
streams_directory: "./config/streams/glorys_v3/"
freeze_modules: ""

# Architecture copied from the v2 run json (glorys_20260730_223127) because it
# was inherited via run lineage and exists in no config file; fresh `train`
# runs MUST carry it explicitly (spec: "v2 sizing"), or they silently fall
# back to config/default_config.yml sizing (ae_local_dim_embed 1024, 2/2
# blocks, ae_aggregation_num_blocks 0, no ae_local_max_tokens_per_cell) and
# crash with "max number of tokens per cell for positional encoding exceeded".
embed_orientation: "channels"
embed_unembed_mode: "block"
embed_dropout_rate: 0.1

ae_local_dim_embed: 2048
ae_local_num_blocks: 4
ae_local_num_heads: 16
ae_local_dropout_rate: 0.1
ae_local_with_qk_lnorm: True
ae_local_max_tokens_per_cell: 256

ae_local_num_queries: 1
ae_local_queries_per_cell: False
ae_adapter_num_heads: 16
ae_adapter_embed: 128
ae_adapter_with_qk_lnorm: True
ae_adapter_with_residual: True
ae_adapter_dropout_rate: 0.1

ae_global_dim_embed: 2048
ae_global_num_blocks: 4
ae_global_num_heads: 32
ae_global_dropout_rate: 0.1
ae_global_with_qk_lnorm: True
ae_global_att_dense_rate: 1.0
ae_global_block_factor: 64
ae_global_mlp_hidden_factor: 2
ae_global_trailing_layer_norm: False

ae_aggregation_num_blocks: 8
ae_aggregation_num_heads: 32
ae_aggregation_dropout_rate: 0.1
ae_aggregation_with_qk_lnorm: True
ae_aggregation_att_dense_rate: 1.0
ae_aggregation_block_factor: 64
ae_aggregation_mlp_hidden_factor: 2

decoder_type: PerceiverIOCoordConditioning
pred_adapter_kv: False
pred_self_attention: True
pred_dyadic_dims: False
pred_mlp_adaln: True

fe_num_blocks: 16
fe_num_heads: 32
fe_dropout_rate: 0.1
fe_with_qk_lnorm: True
fe_layer_norm_after_blocks: [7]
fe_impute_latent_noise_std: 0.0001
forecast_att_dense_rate: 1.0

num_class_tokens: 0
num_register_tokens: 0

healpix_level: 5

rope_2D: False

train_logging:
  terminal: 10
  metrics: 20
  checkpoint: 64

data_loading :
  num_workers: 8

general:
  istep: 0
  run_id: ???

training_config:
  training_mode: ["masking"]
  num_mini_epochs: 8
  samples_per_mini_epoch: 4096
  # Carried from the v2 recipe (run-json lineage, in no config file — same trap
  # as the architecture block): daily windows and the Samudra-2 dynamic loss.
  time_window_step: 24:00:00
  time_window_len: 24:00:00
  losses:
    physical:
      type: LossPhysical
      loss_fcts:
        mse: {}
        dynamic_loss:
          window: 128
          L: 5.0   # 2026-08-21: lowered from 20 (Kacper) - cap weight spread 5:1 so high-error T channels keep gradient
  # 2023-H2 held out for checkpoint selection (spec); 2024 (benchmark year) never trained.
  start_date: 2010-01-01T00:00
  end_date: 2023-06-30T00:00
  learning_rate_scheduling :
    lr_start: 1e-6
    lr_max: 5e-5
    lr_final_decay: 1e-6
    lr_final: 0.0
    num_steps_warmup: 256
    num_steps_cooldown: 512
    policy_warmup: "cosine"
    policy_decay: "cosine"     # NOT constant - the constant-LR drift mode is the #1 diagnosed failure
    policy_cooldown: "linear"
    parallel_scaling_policy: "sqrt"
  forecast :
      time_step: 24:00:00
      offset: 1
      num_steps: 4
      policy: "fixed"
      pushforward: False

validation_config:
  samples_per_mini_epoch: 64
  # inside ATMO coverage, disjoint from training, benchmark year untouched
  start_date: 2022-01-01T00:00
  end_date: 2022-12-31T00:00
