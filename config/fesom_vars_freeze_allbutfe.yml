# Short fine-tune of fvnn003 (no latent noise) in which only the forecast engine trains: the
# encoder, the forcing injection, the target-coordinate embedding and the decoders are frozen. Frozen
# blocks run in eval mode (no dropout), as they do in the rollout. Fresh schedule
# (general.istep=0 on the command line).

fe_impute_latent_noise_std: 0.0

training_config:
  num_mini_epochs: 4
  samples_per_mini_epoch: 2048
  learning_rate_scheduling:
    lr_start: 1e-6
    lr_max: 1e-5
    lr_final_decay: 2e-6
    lr_final: 0.0
    num_steps_warmup: 256
    num_steps_cooldown: 512
  forecast:
    num_steps: 15
    prefix_steps: [0, 90]

freeze_modules: "embed_target_coords|encoder|forcing_module|latent_pre_norm|pred_heads|target_token_engines"

validation_config:
  samples_per_mini_epoch: 256
