# From-scratch training config for the per-variable FESOM ocean streams
# (TEMP, SALT, U, V, SURFACE) plus the IFS_ATMO forcing stream.
#
#   .venv/bin/train --config config/config_fesom_vars.yml
#
# Origin: the architecture and training settings of the saved config of run frcwin01
# (models/frcwin01/model_frcwin01.json). Differences: streams_directory points to the
# per-variable stream set, nothing is frozen, and forecast.prefix_steps is dropped.
# Run state and data paths are not set here (data paths come from the private config).
# The retraining schedule (epochs, learning rate, rollout length) is a separate spec.

streams_directory: ./config/streams/fesom_vars/
zarr_store: "zip"

embed_unembed_mode: "block"
embed_dropout_rate: 0.1

ae_local_dim_embed: 2048
ae_local_num_blocks: 4
ae_local_num_heads: 16
ae_local_dropout_rate: 0.1
ae_local_with_qk_lnorm: True
ae_local_num_queries: 1
ae_local_queries_per_cell: False
ae_local_max_tokens_per_cell: 256

ae_adapter_num_heads: 16
ae_adapter_embed: 128
ae_adapter_with_qk_lnorm: True
ae_adapter_with_residual: True
ae_adapter_dropout_rate: 0.1

ae_global_dim_embed: 2048
ae_global_num_blocks: 4
ae_global_num_heads: 32
ae_global_dropout_rate: 0.1
ae_global_with_qk_lnorm: True
ae_global_att_dense_rate: 1.0
ae_global_block_factor: 64
ae_global_mlp_hidden_factor: 2
ae_global_trailing_layer_norm: False

ae_aggregation_num_blocks: 8
ae_aggregation_num_heads: 32
ae_aggregation_dropout_rate: 0.1
ae_aggregation_with_qk_lnorm: True
ae_aggregation_att_dense_rate: 1.0
ae_aggregation_block_factor: 64
ae_aggregation_mlp_hidden_factor: 2

decoder_type: PerceiverIOCoordConditioning
pred_adapter_kv: False
pred_self_attention: True
pred_dyadic_dims: False
pred_mlp_adaln: True

num_class_tokens: 0
num_register_tokens: 0

fe_num_blocks: 16
fe_num_heads: 16
fe_dropout_rate: 0.1
fe_with_qk_lnorm: True
fe_layer_norm_after_blocks: [7]
fe_impute_latent_noise_std: 0.0001
forecast_att_dense_rate: 1.0

healpix_level: 5
rope_2D: False

with_mixed_precision: True
with_flash_attention: True
compile_model: False
with_fsdp: True
attention_dtype: bf16
mixed_precision_dtype: bf16
mlp_norm_eps: 1e-5
norm_eps: 1e-4
norm_type: "LayerNorm"

freeze_modules: ""

train_logging:
  terminal: 10
  metrics: 20
  checkpoint: 64

data_loading:
  num_workers: 8
  repeat_data_in_mini_epoch: False

training_config:
  training_mode: ["masking"]
  num_mini_epochs: 5
  samples_per_mini_epoch: 2048
  shuffle: True
  start_date: 2010-01-01T00:00
  end_date: 2199-12-31T00:00
  time_window_step: 86400
  time_window_len: 86400

  learning_rate_scheduling:
    lr_start: 1e-6
    lr_max: 1e-5
    lr_final_decay: 2e-6
    lr_final: 0.0
    num_steps_warmup: 256
    num_steps_cooldown: 512
    policy_warmup: "cosine"
    policy_decay: "cosine"
    policy_cooldown: "linear"
    parallel_scaling_policy: "sqrt"

  optimizer:
    grad_clip: 1.0
    weight_decay: 0.1
    log_grad_norms: False
    adamw:
      beta1: 0.98125
      beta2: 0.9875
      eps: 2e-08

  losses:
    physical:
      type: LossPhysical
      loss_fcts:
        mse: {}
        dynamic_loss:
          window: 128
          L: 20.0

  model_input:
    forecasting:
      masking_strategy: "forecast"

  forecast:
    time_step: 86400
    offset: 1
    num_steps: 15
    policy: "fixed"
    pushforward: False

validation_config:
  samples_per_mini_epoch: 64
  shuffle: False
  start_date: 2200-01-01T00:00
  end_date: 2200-12-31T00:00
  validate_with_ema:
    enabled: False
    ema_ramp_up_ratio: 0.09
    ema_halflife_in_thousands: 0.001
  output:
    num_samples: 0
    normalized_samples: False
    streams: null
  validate_before_training: False
