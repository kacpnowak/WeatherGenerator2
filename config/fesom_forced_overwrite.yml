# Overwrite for continuing or fine-tuning a saved FESOM run with the IFS atmosphere as a
# per-step forcing, e.g.
#   train_continue --from-run-id <run> --config config/fesom_forced_overwrite.yml
#
# It turns the run's IFS_ATMO stream into a per-step forcing (additive injection) and keeps
# the run's ocean streams as they are, so their checkpoint weights load. streams_directory is
# left alone: the streams come from the run's config. The forecasting engine is unchanged and
# the new forcing injection starts as an exact no-op (zero gate).
#
# Keys of the run's IFS_ATMO entry that are not named here survive the merge; none of them
# affects the forcing. The ones that would (type, source, source_exclude, diagnostic, target
# channel lists, loss weight) are set here.
#
# For a fresh run with the repository's current ocean stream definitions, set
# `streams_directory: ./config/streams/fesom_forced/` instead of using this file.
streams :
  IFS_ATMO :
    name : IFS_ATMO
    type : forcing
    reader : fesom
    diagnostic : False
    stream_id : 2139
    filenames : ['atmos_all']
    entry_point : "forecast_engine"
    frequency : "06:00:00"
    source : ['10u', '10v', '2d', '2t', 'cp', 'lsp', 'msl', 'tsr', 'tsrc']
    source_exclude : []
    train_target_channels : []
    val_target_channels : []
    geoinfo_channels : []
    loss_weight : 0.
    location_weight : cosine_latitude
    token_size : 8
    tokenize_spacetime : True
    injection :
      mode : additive
      time_reduce : mean
    embed :
      net : transformer
      num_tokens : 1
      num_heads : 8
      dim_embed : 256
      num_blocks : 2
